# Docker Compose development environment for ZERO → AI ENGINEER
#
# Services:
#   postgres  — PostgreSQL 16 database
#   migrate   — one-shot migration runner (golang-migrate)
#   api       — Go API server
#
# Usage:
#   docker compose up           Start all services
#   docker compose up postgres  Start only the database
#   docker compose down -v      Stop and remove volumes (wipes data)

services:
  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL — authoritative data store
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       zero_to_ai_engineer
      POSTGRES_USER:     zero_to_ai_engineer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      # Bind only to localhost so the database is not exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_to_ai_engineer -d zero_to_ai_engineer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # Migrate — applies SQL migrations with golang-migrate then exits.
  # Re-running `docker compose up migrate` is idempotent.
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command: >
      -path=/migrations
      -database=postgres://zero_to_ai_engineer:${POSTGRES_PASSWORD:-password123}@postgres:5432/zero_to_ai_engineer?sslmode=disable
      up
    restart: on-failure

  # ──────────────────────────────────────────────────────────────────────────
  # API — Go modular monolith
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV:        development
      APP_PORT:       "8080"
      DATABASE_URL:   postgres://zero_to_ai_engineer:${POSTGRES_PASSWORD:-password123}@postgres:5432/zero_to_ai_engineer?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_ORIGIN:     ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      # Expose the API only on localhost in development.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
